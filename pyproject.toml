[project]
name = "diastole"
version = "0.1.0"
description = "Real-time heart-rate-conditioned music generation with Magenta RealTime 2"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Diastole project" }]
license = { text = "MIT" }
dependencies = [
    # Magenta RealTime 2 provides the model + MusicCoCa + SpectroStream runtimes.
    "magenta-rt[mlx]==2.0.3",
    # MLX 0.32.x cannot import the exported MRT2 .mlxfn files:
    # RuntimeError: [import_function] Invalid string size.
    # 0.31.1 is verified to import and run the local mrt2_small model.
    "mlx==0.31.1",
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.13",
    "sounddevice>=0.5",
    "mido>=1.3",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
diastole = "diastole.interface.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: needs the real MRT2 model / audio hardware",
    "slow: takes more than a few seconds",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source = ["diastole"]
